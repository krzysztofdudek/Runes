name: CI

on:
  push:
    branches: [main, 'jarl/**', 'release/**']
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Corpus tier: routine (blocking), heavy, or all'
        type: choice
        options: [routine, heavy, all]
        default: routine

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      # The relation tests parse with grammars the recipe builds (npm run grammars): a GitHub release download or a source build at a pinned commit, verified by sha256. Both land in a content-addressed cache, restored here so a warm run needs no network and no toolchain. A cold source build runs tree-sitter build --wasm, which fetches its own wasi-sdk on first use; no Docker or emscripten is involved.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runes/grammars
          key: grammars-${{ hashFiles('grammars/manifest.json', 'grammars/patches/**') }}
      - name: Grammars
        run: npm run grammars
      # The guard over Runes' own src/, tools/ and scripts/ runs inside the suite (test/guard.test.mjs), next to the vendor tool's end-to-end tests.
      - name: Test, including the guard
        if: matrix.node != 24
        run: npm test
      # On Node 24 the same suite runs under Node's own coverage, which fails the job when dist/ (what consumers install and vendor) falls below 98% of lines, 92% of branches or 97% of functions. Measured at 1.0.0: 98.7% lines, 93.5% branches, 98.5% functions. The vendor tool runs as copies inside throwaway consumers, where Node's coverage cannot attribute it to tools/vendor.mjs; its end-to-end and property tests cover it instead.
      - name: Test with coverage thresholds, including the guard
        if: matrix.node == 24
        run: npm run coverage
      # dist/ is committed because consumers vendor it from a clone; a stale dist/ would ship code the tests never saw.
      - name: dist freshness
        run: npm run check:dist

  # The grammars the Windows job parses with, built on Linux. A grammar built from source on Windows has the same code but other bytes (the Windows wasi-sdk names its clang differently in the WASM producers section), so it never matches its pin and buildGrammars refuses the build there. This job fills the content-addressed cache on Ubuntu and hands it over as an artifact; the Windows job verifies every file against its sha256 as it would a local cache.
  grammars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runes/grammars
          key: grammars-${{ hashFiles('grammars/manifest.json', 'grammars/patches/**') }}
      # build-grammars runs from the committed dist/, so no build step is needed here.
      - name: Grammars
        run: npm run grammars
      - uses: actions/upload-artifact@v4
        with:
          name: grammar-cache
          path: ~/.cache/runes/grammars
          if-no-files-found: error
          retention-days: 1

  # Windows: the family runs there too. The vendor tool's end-to-end tests exercise git, file:// clones and line endings on a real Windows checkout; dist freshness also proves .gitattributes keeps the committed output LF. The grammars come from the grammars job (see there) and are read offline, so a missing one fails here rather than starting a source build.
  test-windows:
    needs: grammars
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      RUNES_GRAMMAR_CACHE: ${{ github.workspace }}/../runes-grammar-cache
      RUNES_GRAMMAR_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: grammar-cache
          path: ${{ github.workspace }}/../runes-grammar-cache
      - name: Grammars
        run: npm run grammars
      - name: Test, including the guard
        run: npm test
      - name: dist freshness
        run: npm run check:dist

  # The corpus gate (corpus/manifest.json, scripts/corpus.mjs): public repositories pinned at full commits, every relation edge Runes finds in them held to the committed goldens (corpus/goldens), every change explained in corpus/explained.md, and the references compared with each language's own resolver. It runs on a release branch, on a release tag (release.yml calls this workflow as verify, so a red corpus stops the publish) and by hand with a tier; other pushes and pull requests do not run it. Each repository is fetched by its commit alone, and a fetch that fails fails the job. The oracles run with --strict: a toolchain that is missing fails the job instead of passing as a skip.
  corpus:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNES_CORPUS_DIR: ${{ github.workspace }}/../runes-corpus
      TIER: ${{ inputs.tier || 'routine' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runes/grammars
          key: grammars-${{ hashFiles('grammars/manifest.json', 'grammars/patches/**') }}
      - name: Grammars
        run: npm run grammars
      # The clones are named by their commit and checked against it on every run, so a restored cache cannot change an answer, only save the fetch.
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../runes-corpus
          key: corpus-${{ hashFiles('corpus/manifest.json') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Edges against the goldens
        run: npm run corpus -- --tier "$TIER"
      - name: Resolver oracles, every toolchain required
        run: npm run corpus:oracles -- --tier "$TIER" --strict

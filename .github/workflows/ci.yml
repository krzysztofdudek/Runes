name: CI

on:
  push:
    branches: [main, 'jarl/**', 'release/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      # The guard over Runes' own src/, tools/ and scripts/ runs inside the suite (test/guard.test.mjs), next to the vendor tool's end-to-end tests.
      - name: Test, including the guard
        run: npm test
      # dist/ is committed because consumers vendor it from a clone; a stale dist/ would ship code the tests never saw.
      - name: dist freshness
        run: npm run check:dist

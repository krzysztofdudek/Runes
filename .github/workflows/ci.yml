name: CI

on:
  push:
    branches: [main, 'jarl/**', 'release/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      # The relation tests parse with grammars the recipe builds (npm run grammars): a GitHub release download or a source build at a pinned commit, verified by sha256. Both land in a content-addressed cache, restored here so a warm run needs no network and no toolchain. A cold source build runs tree-sitter build --wasm, which fetches its own wasi-sdk on first use; no Docker or emscripten is involved.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runes/grammars
          key: grammars-${{ hashFiles('grammars/manifest.json', 'grammars/patches/**') }}
      - name: Grammars
        run: npm run grammars
      # The guard over Runes' own src/, tools/ and scripts/ runs inside the suite (test/guard.test.mjs), next to the vendor tool's end-to-end tests.
      - name: Test, including the guard
        run: npm test
      # dist/ is committed because consumers vendor it from a clone; a stale dist/ would ship code the tests never saw.
      - name: dist freshness
        run: npm run check:dist

  # Windows: the family runs there too. The vendor tool's end-to-end tests exercise git, file:// clones and line endings on a real Windows checkout; dist freshness also proves .gitattributes keeps the committed output LF.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runes/grammars
          key: grammars-windows-${{ hashFiles('grammars/manifest.json', 'grammars/patches/**') }}
      - name: Grammars
        run: npm run grammars
      - name: Test, including the guard
        run: npm test
      - name: dist freshness
        run: npm run check:dist
